[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtad-association-pilot"
version = "0.1.0"
description = "MTAD trajectory completion, association and fusion research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "torch>=2.5,<2.11"]

[project.scripts]
association-pilot = "association.cli:main"

[tool.setuptools.packages.find]
include = ["association*", "baselines*"]
