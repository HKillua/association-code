[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtad-online-observation"
version = "0.1.0"
description = "Causal MTAD replay, association and fusion research"
requires-python = ">=3.10"

[project.optional-dependencies]
research = ["numpy>=1.26,<3", "torch>=2.5,<2.11"]

[tool.setuptools]
packages = ["online_observation"]

[tool.setuptools.package-data]
online_observation = ["*_roster.json", "data/*.json"]
